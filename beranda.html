
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kuye Barber</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #131211;
            color: #9b854d;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .poster {
            width: 460px;
            max-width: 100%;
            text-align: center;
            overflow: hidden;
        }

        .brand {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 10px 0 35px;
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border: 2px solid #e8d5ad;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 23px;
        }

        .menu {
            position: relative;
            background: #c96f33;
            color: #fff2d5;
            padding: 35px 30px 28px;
            margin: 0 15px;
            border: 9px solid #f5ecd9;
            border-radius: 35px;
            outline: 2px solid #ad7957;
            box-shadow: 0 12px 20px #0004;
        }

        .menu::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 2px solid #f7ecd5;
            border-radius: 25px;
            pointer-events: none;
        }

        h1 {
            position: relative;
            font-family: 'Cinzel', serif;
            font-size: clamp(27px, 6vw, 38px);
            line-height: 1.2;
            margin-bottom: 22px;
            font-weight: 800;
        }

       
        .foto-barber {
            width: 190px;
            height: 210px;
            object-fit: cover;
            display: block;
            margin: 0 auto 22px;
            border: 4px solid #f8efd8;
            border-radius: 12px;
            box-shadow: 0 6px 15px #0004;
        }

        .prices {
            position: relative;
            text-align: left;
            font-size: 14px;
            line-height: 1.7;
            margin: 0 auto 25px;
            max-width: 230px;
        }

        .prices p {
            margin-bottom: 9px;
        }

        .prices strong {
            display: block;
            font-size: 15px;
        }

        .hours {
            position: relative;
            font-size: 13px;
            padding-top: 12px;
            border-top: 1px solid #f1dfbd;
            line-height: 1.7;
        }

        .address {
            margin-top: 28px;
            font-size: 14px;
            line-height: 1.8;
        }

        .address strong {
            font-size: 16px;
        }

        .decoration {
            margin-top: 18px;
            font-size: 35px;
            letter-spacing: 12px;
        }

        @media (max-width: 400px) {
            .menu {
                padding: 30px 24px 25px;
                margin: 0 5px;
            }

            .brand {
                font-size: 17px;
            }

            .foto-barber {
                width: 150px;
                height: 170px;
            }
        }
    </style>
</head>

<body>
    <main class="poster">

        <header class="brand">
            <div class="brand-icon">💈</div>
            <span>KUYE BARBER</span>
        </header>

        <section class="menu">
            <h1>
                Pangkas<br>
                Rambut Pria
            </h1>

            
            <img
                src="image/pg.jpg"
                alt="Foto Kang Cukur Kuye Barber"
                class="foto-barber"
            >

            <div class="prices">
                <p>
                    Anak-anak
                    <strong>Rp15.000</strong>
                </p>

                <p>
                    Dewasa
                    <strong>Rp15.000</strong>
                </p>

                <p>
                    Janggut
                    <strong>Rp5.000</strong>
                </p>
            </div>

            <div class="hours">
                Buka Setiap Hari | 09.00 - 17.00
            </div>
        </section>

        <footer class="address">
            <strong>Kunjungi kami di:</strong>
            <p>Jl. Terminal Babakan</p>
        </footer>

        <div class="decoration">✂️ 💈</div>

    </main>
</body>
</html>
