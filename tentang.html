<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Layout Kotak</title>
  </head>

  <body>
    <table border="1" style="margin: 0 auto; width: 25%">
      <thead>
        <tr>
          <td colspan="3">1</td>
          <td rowspan="3">2</td>
          <td colspan="2">3</td>
          <td rowspan="2">N</td>
        </tr>

        <tr>
          <td>4</td>
          <td>5</td>
          <td>6</td>

          <td colspan="1">7</td>
          <td colspan="1">8</td>
        </tr>
        <tr>
          <td colspan="3">9</td>
          <td colspan="2">10</td>
          <td colspan="1">N</td>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="7">N</td>
        </tr>

        <tr>
          
          <td>N</td>
          <td>N</td>
          <td>N</td>
          <td>N</td>
          <td>N</td>
          <td>N</td>
          <td>N</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
