<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #14e5ed;
            font-family: serif;
            color: #222;
            margin: 0;
            padding: 20px;
        }

        /* Kotak utama */
        .container {
            width: 500px;
            max-width: 100%;
            margin: 25px auto;
            padding: 20px;
            background-color: white;
            border: 2px solid black;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
            font-size: 24px;
            color: black;
            margin: 0 0 20px;
        }

        /* Kotak tabel */
        table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid black;
            background-color: white;
        }

        th {
            border: 1px solid black;
            padding: 10px;
            background-color: #dddddd;
            font-size: 15px;
        }

        td {
            border: 1px solid black;
            padding: 8px 5px;
            vertical-align: middle;
            font-size: 13px;
        }

        td:first-child {
            width: 120px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        input[type="number"],
        select {
            width: 100%;
            height: 25px;
            padding: 3px;
            border: 1px solid #777;
            border-radius: 3px;
            font-size: 12px;
        }

        .name-inputs,
        .date-inputs,
        .phone-inputs {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .name-inputs input {
            width: 50%;
            min-width: 0;
        }

        .date-inputs input {
            width: 25%;
            min-width: 0;
        }

        .phone-inputs .country-code {
            width: 45px;
            flex-shrink: 0;
        }

        .phone-inputs .phone-number {
            flex: 1;
            min-width: 0;
        }

        .gender-options,
        .department-options {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin: 0 2px 0 0;
            vertical-align: middle;
        }

        .photo-input {
            width: 100%;
            font-size: 10px;
        }

        textarea {
            width: 100%;
            height: 60px;
            padding: 5px;
            border: 1px solid #777;
            border-radius: 3px;
            resize: vertical;
            font-family: inherit;
        }

        .register {
            text-align: center;
            padding: 12px;
            background-color: #eeeeee;
        }

        button {
            font-family: inherit;
            font-size: 14px;
            padding: 6px 18px;
            background-color: #14e5ed;
            color: #222;
            border: 1px solid black;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0bc3cb;
        }

        @media (max-width: 400px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 10px;
            }

            h2 {
                font-size: 20px;
            }

            td {
                font-size: 11px;
                padding: 5px 3px;
            }

            td:first-child {
                width: 100px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Registration Form</h2>

    <form action="#" method="post" enctype="multipart/form-data">

        <table>
            <thead>
                <tr>
                    <th colspan="2">Student Information</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td><label for="roll">Roll no. :</label></td>
                    <td>
                        <input type="text" id="roll" name="roll">
                    </td>
                </tr>

                <tr>
                    <td>Student name :</td>
                    <td>
                        <div class="name-inputs">
                            <input type="text" name="first_name"
                                   placeholder="First Name">
                            -
                            <input type="text" name="last_name"
                                   placeholder="Last Name">
                        </div>
                    </td>
                </tr>

                <tr>
                    <td><label for="father">Father's name :</label></td>
                    <td>
                        <input type="text" id="father" name="father_name">
                    </td>
                </tr>

                <tr>
                    <td>Date of birth :</td>
                    <td>
                        <div class="date-inputs">
                            <input type="text" name="day" placeholder="Day">
                            -
                            <input type="text" name="month" placeholder="Month">
                            -
                            <input type="text" name="year" placeholder="Year">
                        </div>
                        <small>(DD-MM-YYYY)</small>
                    </td>
                </tr>

                <tr>
                    <td><label for="phone">Mobile no. :</label></td>
                    <td>
                        <div class="phone-inputs">
                            <input class="country-code" type="text"
                                   value="+91" name="country_code">
                            -
                            <input class="phone-number" type="tel"
                                   id="phone" name="phone">
                        </div>
                    </td>
                </tr>

                <tr>
                    <td><label for="email">Email id :</label></td>
                    <td>
                        <input type="email" id="email" name="email">
                    </td>
                </tr>

                <tr>
                    <td><label for="password">Password :</label></td>
                    <td>
                        <input type="password" id="password" name="password">
                    </td>
                </tr>

                <tr>
                    <td>Gender :</td>
                    <td>
                        <div class="gender-options">
                            <label>
                                <input type="radio" name="gender" value="Male">
                                Male
                            </label>

                            <label>
                                <input type="radio" name="gender" value="Female">
                                Female
                            </label>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td>Department :</td>
                    <td>
                        <div class="department-options">
                            <label><input type="checkbox" name="department[]" value="CSE"> CSE</label>
                            <label><input type="checkbox" name="department[]" value="IT"> IT</label>
                            <label><input type="checkbox" name="department[]" value="ECE"> ECE</label>
                            <label><input type="checkbox" name="department[]" value="Civil"> Civil</label>
                            <label><input type="checkbox" name="department[]" value="Mech"> Mech</label>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td><label for="course">Course :</label></td>
                    <td>
                        <select id="course" name="course">
                            <option value="">Select Current Course's</option>
                            <option value="HTML">HTML</option>
                            <option value="CSS">CSS</option>
                            <option value="JavaScript">JavaScript</option>
                            <option value="Python">Python</option>
                            <option value="Java">Java</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="photo">Student photo :</label></td>
                    <td>
                        <input class="photo-input" type="file"
                               id="photo" name="photo" accept="image/*">
                    </td>
                </tr>

                <tr>
                    <td><label for="city">City :</label></td>
                    <td>
                        <input type="text" id="city" name="city">
                    </td>
                </tr>

                <tr>
                    <td><label for="address">Address :</label></td>
                    <td>
                        <textarea id="address" name="address"></textarea>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" class="register">
                        <button type="submit">Register</button>
                    </td>
                </tr>
            </tbody>
        </table>

    </form>

</div>

</body>
</html>
```
